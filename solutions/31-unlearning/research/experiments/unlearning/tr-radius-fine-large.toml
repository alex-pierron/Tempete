# Campagne trust_region a pleine echelle (RTX 5080), etape 1 : rayon teste a chaque pas, grands rayons.
# Fiche de la campagne : experiments/unlearning/trust-region-campaign.md (hypotheses et criteres
# de refutation fixes avant lancement). Tableau : make hk-unl-scores -> SCOREBOARD.md.
#   make hk-run SPEC=tr-radius-fine-large
# RUN DE REGLAGE (fold d'audit de 20 %) : ne pas soumettre.

id = "tr-radius-fine-large"
task = "unlearning"
idea = "tr radius fine large"
hypothesis = "Avec un arret teste a chaque pas, la KL finale suit epsilon ; au-dela d'un optimum, score_min retombe et la porte finit par casser."
where = "local"

[resources]
gpus = 4
time_limit = "00:45:00"

[sweep]
kl_radius = [0.2, 0.3, 0.5, 0.8]

[[steps]]
name = "train"
args = ["run", "--method", "trust_region", "--set", "target_temperature=6", "--set", "radius_check_every=1", "--set", "holdout_fraction=0.2", "--set", "epochs=10", "--set", "kl_radius={kl_radius}",
        "--out", "{out}/candidate.pt"]
args_local = ["--config", "auto"]
args_jureca = ["--config", "full"]

[expect]
submission = "candidate.pt"
metrics_file = "candidate.json"
primary_metric = "bench.score_min"
higher_is_better = true
