# Experience Unlearning (31-unlearning). Mode d'emploi : docs/hackathon/process.md, unlearning.md par. 2, 8-9
#   make hk-run SPEC=v-dumb                 local : smoke sur Mac, full sur GPU CUDA (RTX 5080)
#   make hk-run SPEC=v-dumb WHERE=jureca    cluster : full, 4 A100 (un noeud, le maximum)
# Un `run` n'envoie jamais rien au serveur : `submit --yes` reste un geste explicite.
# RUN DE REGLAGE : 20 % du forget set est tenu a l'ecart (fold d'audit du banc), le fichier produit
# n'a PAS oublie ces images. Ne pas le soumettre ; le run final se fait sans holdout.
# V_Dumb (rapport, section V_Dumb) : la methode la plus simple. Chaque image oubliee monte jusqu'a
# une perte cible (charniere), ses vues fortes restent a la sortie de l'original. Trois cibles
# (perte de l'original sur une vue forte d'aire 0,60 / 0,50 / 0,45, les trois doublures du banc)
# et un bras sans ancre. Le dernier --set l'emporte.

id = "v-dumb"
task = "unlearning"
idea = "v dumb"
hypothesis = "La methode la plus simple (montee de perte bornee + ancre sur les vues fortes) atteint au moins la V1 (0,0637) ; les cibles elaborees des V2-V3 ne valent que si elles la battent de plus de 2 sigma."
where = "local"

[resources]
gpus = 4                   # 1 variante par A100 ; 4 au plus (un noeud)
time_limit = "00:30:00"    # estimation : 3 passes, ~1 min par variante sur la RTX 5080, non mesuree

[sweep]
# 0.31 / 0.45 / 0.63 : perte moyenne de l'original sur une vue forte d'aire 0,60 / 0,50 / 0,45
# (measurements/v3_targets.json) ; retain_weight=0 : la cible du milieu sans ancre.
arm = ["dumb_target_loss=0.31", "dumb_target_loss=0.45", "dumb_target_loss=0.63", "retain_weight=0"]

[[steps]]
name = "train"
args = ["run", "--method", "dumb", "--set", "holdout_fraction=0.2", "--set", "{arm}",
        "--out", "{out}/candidate.pt"]
# auto : full sur un GPU CUDA, smoke ailleurs (Mac, 64 images).
args_local = ["--config", "auto"]
args_jureca = ["--config", "full"]

[expect]
submission = "candidate.pt"
metrics_file = "candidate.json"
# Banc bench-v4. A lire avec bench.score_min_family.crop / .mask, bench.retain, bench.audit_kl,
# final.forget_loss_mean / final.forget_loss_std (perte des images entrainees), final.reached.
primary_metric = "bench.score_min"
higher_is_better = true
