# Campagne trust_region V3 a pleine echelle (RTX 5080, bench-v4).
# Fiche de la campagne : experiments/unlearning/trust-region-v3-campaign.md (hypotheses et criteres
# fixes avant lancement). Tableau : make hk-unl-scores -> SCOREBOARD.md (section bench-v4).
#   make hk-run SPEC=tr3-views-1a
# RUN DE REGLAGE (fold d'audit de 20 %) : ne pas soumettre.

id = "tr3-views-1a"
task = "unlearning"
idea = "tr3 views 1a"
hypothesis = "Une vue a l'aire 0,6 (plafond 0,12 sous les six doublures) bat la base de plus de 2 sigma."
where = "local"

[resources]
gpus = 2
time_limit = "00:45:00"

[sweep]
trust_lambda = [0.25, 0.5]

[[steps]]
name = "train"
args = ["run", "--method", "trust_region", "--set", "trust_target=calibrated", "--set", "trust_lambda={trust_lambda}", "--set", "trust_hedge=0.25", "--set", "target_temperature=6", "--set", "target_views=1", "--set", "target_view_min_area=0.6", "--set", "radius_fraction=0.9", "--set", "radius_check_every=1", "--set", "altered_fraction=0", "--set", "holdout_fraction=0.2", "--set", "epochs=10",
        "--out", "{out}/candidate.pt"]
args_local = ["--config", "auto"]
args_jureca = ["--config", "full"]

[expect]
submission = "candidate.pt"
metrics_file = "candidate.json"
primary_metric = "bench.score_min"
higher_is_better = true
