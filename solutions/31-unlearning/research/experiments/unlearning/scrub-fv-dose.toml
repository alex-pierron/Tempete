# Experience Unlearning (31-unlearning). Mode d'emploi : docs/hackathon/process.md, unlearning.md par. 2, 8-9
#   make hk-run SPEC=scrub-fv-dose                 local : smoke sur Mac, full sur GPU CUDA (RTX 5080)
#   make hk-run SPEC=scrub-fv-dose WHERE=jureca    cluster : full, 4 A100 (un noeud, le maximum)
# Un `run` n'envoie jamais rien au serveur : `submit --yes` reste un geste explicite.
# RUN DE REGLAGE : 20 % du forget set est tenu a l'ecart (fold d'audit du banc), le fichier produit
# n'a PAS oublie ces images. Ne pas le soumettre ; le run final se fait sans holdout.
# Suivi 1 de scrub-forget-views (fiche scrub-forget-views.md, "Suivi 1", pose avant ce run) : a lr
# 2e-4 l'ancre conforme tient encore (retain 0,96, KL d'audit 0,04) la ou le proxy s'effondre a 3e-4 ;
# on monte la dose. Apparie aux runs scrub-forget-views (memes graines) et a ref4-v3.

id = "scrub-fv-dose"
task = "unlearning"
idea = "scrub fv dose"
hypothesis = "L'ancre conforme deplace l'optimum de dose de scrub au-dela de 2e-4 : a lr 3e-4 ou 4e-4, la moyenne des graines 0 et 1 depasse 0,086 avec retain >= 0,80."
where = "local"

[resources]
gpus = 4                   # 1 variante par A100 ; 4 au plus (un noeud)
time_limit = "00:30:00"    # scrub : ~45 s par run sur la RTX 5080

[sweep]
lr = [3e-4, 4e-4]
seed = [0, 1]

[[steps]]
name = "train"
args = ["run", "--method", "scrub", "--set", "retain_source=forget_views",
        "--set", "holdout_fraction=0.2", "--set", "lr={lr}", "--set", "seed={seed}",
        "--out", "{out}/candidate.pt"]
args_local = ["--config", "auto"]
args_jureca = ["--config", "full"]

[expect]
submission = "candidate.pt"
metrics_file = "candidate.json"
primary_metric = "bench.score_min"
higher_is_better = true
