# Campagne trust_region a pleine echelle (RTX 5080), etape 2 : taux d'apprentissage.
# Fiche de la campagne : experiments/unlearning/trust-region-campaign.md (hypotheses et criteres
# de refutation fixes avant lancement). Tableau : make hk-unl-scores -> SCOREBOARD.md.
#   make hk-run SPEC=tr-lr
# RUN DE REGLAGE (fold d'audit de 20 %) : ne pas soumettre.

id = "tr-lr"
task = "unlearning"
idea = "tr lr"
hypothesis = "Un taux plus bas approche epsilon plus doucement et localise mieux (ratio plus haut a KL egale)."
where = "local"

[resources]
gpus = 4
time_limit = "00:45:00"

[sweep]
lr = [3e-6, 3e-5, 1e-4]

[[steps]]
name = "train"
args = ["run", "--method", "trust_region", "--set", "target_temperature=6", "--set", "radius_check_every=1", "--set", "holdout_fraction=0.2", "--set", "epochs=10", "--set", "kl_radius=0.15", "--set", "lr={lr}",
        "--out", "{out}/candidate.pt"]
args_local = ["--config", "auto"]
args_jureca = ["--config", "full"]

[expect]
submission = "candidate.pt"
metrics_file = "candidate.json"
primary_metric = "bench.score_min"
higher_is_better = true
