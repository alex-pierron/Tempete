# Campagne trust_region V2 a pleine echelle (RTX 5080), V2, etape 3 : aire des vues a tau = 2.
# Fiche de la campagne : experiments/unlearning/trust-region-v2-campaign.md (hypotheses et criteres
# de refutation fixes avant lancement). Tableau : make hk-unl-scores -> SCOREBOARD.md.
#   make hk-run SPEC=tr2-area-t2
# RUN DE REGLAGE (fold d'audit de 20 %) : ne pas soumettre.

id = "tr2-area-t2"
task = "unlearning"
idea = "tr2 area t2"
hypothesis = "A tau = 2, le gain de la V2 sur la V1 suit le recouvrement entre l'aire des vues et celle des doublures du gold (0,40-0,70)."
where = "local"

[resources]
gpus = 4
time_limit = "00:45:00"

[sweep]
target_view_min_area = [0.25, 0.35, 0.55, 0.65]

[[steps]]
name = "train"
args = ["run", "--method", "trust_region", "--set", "target_temperature=2", "--set", "radius_check_every=1", "--set", "holdout_fraction=0.2", "--set", "epochs=10", "--set", "trust_target=views", "--set", "target_views=3", "--set", "kl_radius=0.15", "--set", "target_view_min_area={target_view_min_area}",
        "--out", "{out}/candidate.pt"]
args_local = ["--config", "auto"]
args_jureca = ["--config", "full"]

[expect]
submission = "candidate.pt"
metrics_file = "candidate.json"
primary_metric = "bench.score_min"
higher_is_better = true
