# Campagne trust_region a pleine echelle (RTX 5080), etape 3 : temperature de la cible.
# Fiche de la campagne : experiments/unlearning/trust-region-campaign.md (hypotheses et criteres
# de refutation fixes avant lancement). Tableau : make hk-unl-scores -> SCOREBOARD.md.
#   make hk-run SPEC=tr-temperature
# RUN DE REGLAGE (fold d'audit de 20 %) : ne pas soumettre.

id = "tr-temperature"
task = "unlearning"
idea = "tr temperature"
hypothesis = "La temperature de la cible fixe la direction du mouvement, donc le prediction_score."
where = "local"

[resources]
gpus = 4
time_limit = "00:45:00"

[sweep]
target_temperature = [4, 5, 8, 12]

[[steps]]
name = "train"
args = ["run", "--method", "trust_region", "--set", "radius_check_every=1", "--set", "holdout_fraction=0.2", "--set", "epochs=10", "--set", "kl_radius=0.15", "--set", "target_temperature={target_temperature}",
        "--out", "{out}/candidate.pt"]
args_local = ["--config", "auto"]
args_jureca = ["--config", "full"]

[expect]
submission = "candidate.pt"
metrics_file = "candidate.json"
primary_metric = "bench.score_min"
higher_is_better = true
