# Campagne trust_region a pleine echelle (RTX 5080), etape 6 : confirmation du rayon sur 3 graines.
# Fiche de la campagne : experiments/unlearning/trust-region-campaign.md (hypotheses et criteres
# de refutation fixes avant lancement). Tableau : make hk-unl-scores -> SCOREBOARD.md.
#   make hk-run SPEC=tr-confirm-radius
# RUN DE REGLAGE (fold d'audit de 20 %) : ne pas soumettre. Graine 0 : tr-radius-fine-*.

id = "tr-confirm-radius"
task = "unlearning"
idea = "tr confirm radius"
hypothesis = "Sur 3 graines, epsilon = 0,1, 0,15 et 0,2 restent a moins d'un ecart-type les uns des autres : l'optimum est un plateau, pas un pic."
where = "local"

[resources]
gpus = 4
time_limit = "00:45:00"

[sweep]
kl_radius = [0.1, 0.2]
seed = [1, 2]

[[steps]]
name = "train"
args = ["run", "--method", "trust_region", "--set", "target_temperature=6", "--set", "radius_check_every=1",
        "--set", "holdout_fraction=0.2", "--set", "epochs=10", "--set", "kl_radius={kl_radius}",
        "--set", "seed={seed}", "--out", "{out}/candidate.pt"]
args_local = ["--config", "auto"]
args_jureca = ["--config", "full"]

[expect]
submission = "candidate.pt"
metrics_file = "candidate.json"
primary_metric = "bench.score_min"
higher_is_better = true
