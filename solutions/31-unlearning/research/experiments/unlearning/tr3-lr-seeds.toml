# Experience Unlearning (31-unlearning). Mode d'emploi : docs/hackathon/process.md, unlearning.md par. 2, 8-9
#   make hk-run SPEC=tr3-lr-seeds                 local : smoke sur Mac, full sur GPU CUDA (RTX 5080)
#   make hk-run SPEC=tr3-lr-seeds WHERE=jureca    cluster : full, 4 A100 (un noeud, le maximum)
# Un `run` n'envoie jamais rien au serveur : `submit --yes` reste un geste explicite.
# RUN DE REGLAGE : 20 % du forget set est tenu a l'ecart (fold d'audit du banc), le fichier produit
# n'a PAS oublie ces images. Ne pas le soumettre ; le run final se fait sans holdout.
# Suivi hors V4 (trust-region-v4-campaign.md, pose avant ce run) : le temoin sans ancre de
# tr4-anchored-lr (V3 retenue a lr 3e-5) vaut 0,0876 a la graine 0 contre 0,0784 a lr 1e-5. Graines 1
# et 2 a 3e-5 (trois graines appariees a ref4-v3 avec le temoin), et lr 1e-4 aux memes graines
# (direction).

id = "tr3-lr-seeds"
task = "unlearning"
idea = "tr3 lr seeds"
hypothesis = "A rayon egal, la V3 retenue gagne a lr 3e-5 : moyenne des graines 0-2 > 0,086 et gain apparie sous le masquage au-dela de 2 sigma."
where = "local"

[resources]
gpus = 4
time_limit = "00:45:00"

[sweep]
lr = [3e-5, 1e-4]
seed = [1, 2]

[[steps]]
name = "train"
args = ["run", "--method", "trust_region", "--set", "trust_target=calibrated", "--set", "trust_lambda=0.25",
        "--set", "trust_hedge=0", "--set", "target_temperature=6", "--set", "target_views=4",
        "--set", "target_view_min_area=0.5", "--set", "radius_fraction=0.9",
        "--set", "radius_check_every=1", "--set", "altered_fraction=0", "--set", "epochs=10",
        "--set", "holdout_fraction=0.2", "--set", "lr={lr}", "--set", "seed={seed}", "--out", "{out}/candidate.pt"]
args_local = ["--config", "auto"]
args_jureca = ["--config", "full"]

[expect]
submission = "candidate.pt"
metrics_file = "candidate.json"
primary_metric = "bench.score_min"
higher_is_better = true
