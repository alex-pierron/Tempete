# Campagne trust_region V2 a pleine echelle (RTX 5080), etapes 5-6.
# Fiche de la campagne : experiments/unlearning/trust-region-v2-campaign.md (hypotheses et criteres
# de refutation fixes avant lancement). Tableau : make hk-unl-scores -> SCOREBOARD.md.
#   make hk-run SPEC=tr2-radius-best
# RUN DE REGLAGE (fold d'audit de 20 %) : ne pas soumettre.

id = "tr2-radius-best"
task = "unlearning"
idea = "tr2 radius best"
hypothesis = "Comme pour la V1, le score de la V2 forme un plateau entre epsilon = 0,1 et 0,2, optimum vers 0,15."
where = "local"

[resources]
gpus = 4
time_limit = "00:45:00"

[sweep]
kl_radius = [0.1, 0.2]
target_temperature = [0.5, 1]

[[steps]]
name = "train"
args = ["run", "--method", "trust_region", "--set", "trust_target=views", "--set", "target_view_min_area=0.45",
        "--set", "target_views=3", "--set", "radius_check_every=1", "--set", "holdout_fraction=0.2",
        "--set", "epochs=10", "--set", "kl_radius={kl_radius}", "--set", "target_temperature={target_temperature}",
        "--out", "{out}/candidate.pt"]
args_local = ["--config", "auto"]
args_jureca = ["--config", "full"]

[expect]
submission = "candidate.pt"
metrics_file = "candidate.json"
primary_metric = "bench.score_min"
higher_is_better = true
