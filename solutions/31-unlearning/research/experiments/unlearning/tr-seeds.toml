# Campagne trust_region a pleine echelle (RTX 5080), graines au point d'ancrage (bruit).
# Fiche de la campagne : experiments/unlearning/trust-region-campaign.md (hypotheses et criteres
# de refutation fixes avant lancement). Tableau : make hk-unl-scores -> SCOREBOARD.md.
#   make hk-run SPEC=tr-seeds
# RUN DE REGLAGE (fold d'audit de 20 %) : ne pas soumettre.

id = "tr-seeds"
task = "unlearning"
idea = "tr seeds"
hypothesis = "A epsilon = 0,15, l'ecart-type de score_min entre graines est petit devant l'ecart entre reglages."
where = "local"

[resources]
gpus = 4
time_limit = "00:45:00"

[sweep]
seed = [0, 1, 2]

[[steps]]
name = "train"
args = ["run", "--method", "trust_region", "--set", "target_temperature=6", "--set", "radius_check_every=1", "--set", "holdout_fraction=0.2", "--set", "epochs=10", "--set", "kl_radius=0.15", "--set", "seed={seed}",
        "--out", "{out}/candidate.pt"]
args_local = ["--config", "auto"]
args_jureca = ["--config", "full"]

[expect]
submission = "candidate.pt"
metrics_file = "candidate.json"
primary_metric = "bench.score_min"
higher_is_better = true
