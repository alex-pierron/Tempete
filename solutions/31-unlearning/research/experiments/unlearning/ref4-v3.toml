# Campagne V3 (RTX 5080) : references recalculees en bench-v4, enregistrees au lab (graines 0-2).
# Memes reglages que les runs bench-v3 retenus ; l'entrainement est deterministe a graine egale.
# Fiche : experiments/unlearning/trust-region-v3-campaign.md. RUN DE REGLAGE : ne pas soumettre.
#   make hk-run SPEC=ref4-v3
# Deja mesure sur la RTX 5080 (graines 0-2 : tr3-hedge v1, tr3-seeds v1-v2), a rejouer ailleurs.

id = "ref4-v3"
task = "unlearning"
idea = "ref4 v3"
hypothesis = "Reference V3 retenue (b = 0, lambda 0,25, rho 0,9, aire 0,5, 4 vues) en bench-v4 : redonne 0,0798 +- 0,0012."
where = "local"

[resources]
gpus = 3
time_limit = "00:45:00"

[sweep]
seed = [0, 1, 2]

[[steps]]
name = "train"
args = ["run", "--method", "trust_region", "--set", "trust_target=calibrated", "--set", "trust_lambda=0.25",
        "--set", "trust_hedge=0", "--set", "target_temperature=6", "--set", "target_views=4",
        "--set", "target_view_min_area=0.5", "--set", "radius_fraction=0.9",
        "--set", "radius_check_every=1", "--set", "altered_fraction=0", "--set", "epochs=10",
        "--set", "holdout_fraction=0.2", "--set", "seed={seed}", "--out", "{out}/candidate.pt"]
args_local = ["--config", "auto"]
args_jureca = ["--config", "full"]

[expect]
submission = "candidate.pt"
metrics_file = "candidate.json"
primary_metric = "bench.score_min"
higher_is_better = true
