# Campagne trust_region V3 a pleine echelle (RTX 5080, bench-v4).
# Fiche de la campagne : experiments/unlearning/trust-region-v3-campaign.md (hypotheses et criteres
# fixes avant lancement). Tableau : make hk-unl-scores -> SCOREBOARD.md (section bench-v4).
#   make hk-run SPEC=tr3-hedge
# RUN DE REGLAGE (fold d'audit de 20 %) : ne pas soumettre.

id = "tr3-hedge"
task = "unlearning"
idea = "tr3 hedge"
hypothesis = "Une couverture b = 0,1 fait mieux sous le masquage que b = 0,25 (plafond 0,061 contre 0,041) ; b = 0 retire toute couverture."
where = "local"

[resources]
gpus = 2
time_limit = "00:45:00"

[sweep]
trust_hedge = [0, 0.1]

[[steps]]
name = "train"
args = ["run", "--method", "trust_region", "--set", "trust_target=calibrated", "--set", "trust_lambda=0.25", "--set", "trust_hedge={trust_hedge}", "--set", "target_temperature=6", "--set", "target_views=4", "--set", "target_view_min_area=0.5", "--set", "radius_fraction=0.9", "--set", "radius_check_every=1", "--set", "altered_fraction=0", "--set", "holdout_fraction=0.2", "--set", "epochs=10",
        "--out", "{out}/candidate.pt"]
args_local = ["--config", "auto"]
args_jureca = ["--config", "full"]

[expect]
submission = "candidate.pt"
metrics_file = "candidate.json"
primary_metric = "bench.score_min"
higher_is_better = true
