[project]
name = "wmkit"
version = "0.1.0"
description = "Watermarking challenge toolkit: image/video watermarking, attacks, evaluation, text watermarking, model auditing, unlearning."
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "numpy",
    "scipy",
    "pillow",
    "scikit-image",
    "scikit-learn",
    "diffusers>=0.43",  # regen_vae removal attack (optional at runtime)
    "opencv-python",
    "kornia",
    "PyWavelets",
    "pandas",
    "psutil",  # auto_batch_size reads free memory to size batches (wmkit.batch)
    "tabulate",
    "matplotlib",
    "tqdm",
    "pydantic>=2",
    # Meta videoseal runtime deps (installed --no-deps from third_party/videoseal; decord excluded: no macOS arm64 wheel)
    "lpips",
    "pytorch-msssim",
    "einops",
    "omegaconf",
    "timm==0.9.16",
    "safetensors",
    "av",
    "ffmpeg-python",
    "pycocotools",
    "calflops",
    "tensorboard",
    "setuptools",
    # LLM side (text watermarking, model equality testing)
    "transformers",
    "accelerate",
    "huggingface_hub",
    "requests",  # videoseal.utils.cfg
]

[dependency-groups]
dev = ["pytest", "mypy", "ruff", "ipykernel", "model-equality-testing==0.0.2"]  # optional: MET conformance tests

[project.scripts]
wmkit = "wmkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wmkit", "src/hackathon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: needs pretrained weights, network or more than ~10 s of compute",
]
addopts = "-m 'not slow'"

[tool.mypy]
strict = true
ignore_missing_imports = true
mypy_path = "src"
packages = ["wmkit", "hackathon"]

[tool.ruff]
line-length = 100
target-version = "py312"
